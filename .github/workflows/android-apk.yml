name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Check backend configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Missing EXPO_PUBLIC_SUPABASE_URL secret'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing EXPO_PUBLIC_SUPABASE_ANON_KEY secret'; exit 1; }
      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Generate Android project
        working-directory: apps/mobile
        run: node ../../node_modules/expo/bin/cli prebuild --platform android --no-install
      - name: Build standalone APK for Android phones
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Verify APK and bundled JavaScript
        working-directory: apps/mobile/android
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          unzip -l "$apk" | grep 'assets/index.android.bundle'
          cp "$apk" weight-tracker.apk
          sha256sum weight-tracker.apk > weight-tracker.apk.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: weight-tracker-apk
          path: |
            apps/mobile/android/weight-tracker.apk
            apps/mobile/android/weight-tracker.apk.sha256
          if-no-files-found: error
          retention-days: 30
